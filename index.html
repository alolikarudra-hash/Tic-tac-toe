<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      gap: 6px;
      justify-content: center;
      margin-top: 20px;
    }

    .cell {
      width: 90px;
      height: 90px;
      background: white;
      font-size: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: 2px solid #333;
    }

    .cell:hover {
      background: #eaeaea;
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 6px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Tic Tac Toe</h1>

<div class="board">
  <div class="cell" onclick="play(this,0)"></div>
  <div class="cell" onclick="play(this,1)"></div>
  <div class="cell" onclick="play(this,2)"></div>
  <div class="cell" onclick="play(this,3)"></div>
  <div class="cell" onclick="play(this,4)"></div>
  <div class="cell" onclick="play(this,5)"></div>
  <div class="cell" onclick="play(this,6)"></div>
  <div class="cell" onclick="play(this,7)"></div>
  <div class="cell" onclick="play(this,8)"></div>
</div>

<p id="status">Player X Turn</p>
<button onclick="resetGame()">Restart</button>

<script>
  let board = ["","","","","","","","",""];
  let current = "X";
  let gameOver = false;

  function play(cell, index) {
    if (board[index] !== "" || gameOver) return;

    board[index] = current;
    cell.innerText = current;

    if (checkWin()) {
      document.getElementById("status").innerText = current + " Wins!";
      gameOver = true;
      return;
    }

    if (!board.includes("")) {
      document.getElementById("status").innerText = "Draw!";
      gameOver = true;
      return;
    }

    current = current === "X" ? "O" : "X";
    document.getElementById("status").innerText = "Player " + current + " Turn";
  }

  function checkWin() {
    const win = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    return win.some(c =>
      board[c[0]] &&
      board[c[0]] === board[c[1]] &&
      board[c[1]] === board[c[2]]
    );
  }

  function resetGame() {
    board = ["","","","","","","","",""];
    current = "X";
    gameOver = false;

    document.querySelectorAll(".cell").forEach(c => c.innerText = "");
    document.getElementById("status").innerText = "Player X Turn";
  }
</script>

</body>
</html>
